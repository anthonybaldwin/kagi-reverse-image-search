<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>Searching Kagi…</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fafafa;
      --fg: #1a1a1a;
      --muted: #6b6b6b;
      --card: #ffffff;
      --card-border: rgba(0, 0, 0, 0.06);
      --accent: #FFC700;
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      --button-bg: #f0f0f0;
      --button-hover: #e4e4e4;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #191919;
        --fg: #f0f0f0;
        --muted: #a0a0a0;
        --card: #232323;
        --card-border: rgba(255, 255, 255, 0.08);
        --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
        --button-bg: #333333;
        --button-hover: #3f3f3f;
      }
    }
    :root[data-theme="dark"] {
      --bg: #191919;
      --fg: #f0f0f0;
      --muted: #a0a0a0;
      --card: #232323;
      --card-border: rgba(255, 255, 255, 0.08);
      --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      --button-bg: #333333;
      --button-hover: #3f3f3f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    .card {
      width: min(100%, 440px);
      padding: 36px 32px 32px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      text-align: center;
      /* Stay invisible for the first second: a normal upload finishes before
         this ever shows, so the hand-off page is just a blank themed tab. */
      animation: rise 260ms ease-out 1s both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes appear {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .logo { width: 120px; height: auto; margin: 0 auto 24px; display: block; color: var(--fg); }

    .preview {
      position: relative;
      display: none;
      max-width: 100%;
      margin: 0 auto 24px;
      border-radius: 10px;
      overflow: hidden;
      background:
        linear-gradient(45deg, rgba(128,128,128,.15) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.15) 75%),
        linear-gradient(45deg, rgba(128,128,128,.15) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.15) 75%);
      background-size: 16px 16px;
      background-position: 0 0, 8px 8px;
      box-shadow: 0 0 0 3px var(--accent);
    }
    .preview.show { display: inline-block; }
    .preview img { display: block; max-width: 100%; max-height: 260px; }

    .status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 16px;
      font-weight: 600;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid rgba(255, 199, 0, 0.25);
      border-top-color: var(--accent);
      animation: spin 800ms linear infinite;
      flex: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .sub { margin-top: 8px; font-size: 13px; color: var(--muted); }

    .fallback { display: none; margin-top: 20px; }
    .fallback.show { display: block; }
    .fallback p { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .button {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      border: 0;
      background: var(--accent);
      color: #000;
      font: 600 14px/1.4 inherit;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      transition: filter 120ms ease, transform 120ms ease;
    }
    .button:hover { filter: brightness(0.95); transform: translateY(-1px); }
    .button.secondary { background: var(--button-bg); color: var(--fg); }
    .button.secondary:hover { background: var(--button-hover); }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: appear 1ms linear 1s both; }
      .spinner { animation-duration: 1.6s; }
    }
  </style>
</head>
<body>

      <path d="M63.535 29.1133H41.4705L22.3303 48.344L15.6844 55.0214V18.1624H0V91.6133H15.6844V64.1026L22.3303 70.7799V70.5128L43.0655 91.6133H65.13L31.3687 59.562L63.535 29.1133Z" fill="currentColor"/>
    </svg>

    <div id="preview" class="preview"><img id="previewImage" alt="Selected image"></div>

    <div class="status">
      <span class="spinner" aria-hidden="true"></span>
      <span id="statusText">Searching Kagi…</span>
    </div>
    <p id="subText" class="sub">Uploading your selection to Kagi Reverse Image Search.</p>

    <div id="fallback" class="fallback">
      <p>This is taking longer than usual. You can keep waiting, or upload the image yourself.</p>
      <div class="actions">
        <a id="downloadLink" class="button" download="selection.png">Download image</a>
        <a id="openKagiLink" class="button secondary" href="https://kagi.com/reverse">Open Kagi Reverse Search</a>
      </div>
    </div>
  </main>

  <form id="uploadForm" hidden method="POST" action="https://kagi.com/reverse/upload" enctype="multipart/form-data">
    <input type="file" name="file" id="fileInput">
  </form>

  <script src="upload.js"></script>
</body>
</html>
